
stages:
  - security
  - dast


sast:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - echo "Checking DNS resolution..."
    - getent hosts api.sonarcloud.io
    - echo "Running SonarCloud analysis..."
    - >-
      sonar-scanner
      -Dsonar.projectKey=flask-app123_flask-app
      -Dsonar.organization=flask-app123
      -Dsonar.sources=vulnerable_flask_app
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}


sca:
  stage: security
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check pip-audit
    - pip-audit -r vulnerable_flask_app/requirements.txt
  allow_failure: true
dast:
  stage: dast
  image: docker:cli
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  script:
    - docker info
    - docker network inspect zap-network
    - docker inspect flask-app-container
    - mkdir -p zap_reports
    - chmod -R 777 zap_reports
    - |
      docker run --rm \
        --network zap-network \
        -v "$CI_PROJECT_DIR/zap_reports:/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-full-scan.py \
        -t http://flask-app-container:5000 \
        -I -j \
        -r /zap/wrk/report.html \
        -J /zap/wrk/report.json \
        -x /zap/wrk/report.xml \
        -a
  artifacts:
    when: always
    paths:
      - zap_reports/
    expire_in: 5 days