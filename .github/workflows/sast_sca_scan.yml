
name: SAST & SCA Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sast_sca_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vulnerable_flask_app/requirements.txt

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.sast }}
        with:
          args: >
            -Dsonar.organization=flask-app123
            -Dsonar.projectKey=flask-app123_flask-app
            -Dsonar.sources=vulnerable_flask_app
            -Dsonar.scanner.skipJreProvisioning=true

      - name: SonarQube Quality Gate check
        if: always()
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.sast }}

      - name: Run pip-audit
        if: always()
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r vulnerable_flask_app/requirements.txt
