name: SAST & SCA Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sast_sca_checks:
    name: SAST and SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vulnerable_flask_app/requirements.txt

      # SAST: Static Application Security Testing
      - name: Run SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=flask-app123
            -Dsonar.projectKey=flask-app123_flask-app1
            -Dsonar.sources=vulnerable_flask_app
            -Dsonar.scanner.skipJreProvisioning=true

      # SCA: Software Composition Analysis
      - name: Run pip-audit
        if: always()
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r vulnerable_flask_app/requirements.txt